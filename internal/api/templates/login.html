<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/themes/global.css" type="text/css" />
<link rel="stylesheet" href="/themes/{{.Theme}}/global.css" type="text/css" id="csstheme" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />
<title>{{.AppName}} - Log in</title>
</head>
<body style="background:#f5f5f5">
<div class="topbar"><table style="width:100%"><tr><td>
<a href="/servers" style="color:#fff; font-weight:700"><i class="bi bi-database"></i> {{.AppName}}</a> <span style="opacity:0.9; font-size:11px">{{.AppVersion}}</span>
</td><td style="text-align:right">
<form method="get" style="display:inline">
<select name="theme" onchange="this.form.submit()" class="form-select form-select-sm" style="display:inline-block; width:auto">
{{range .AvailableThemes}}<option value="{{.}}" {{if eq . $.Theme}}selected{{end}}>{{.}}</option>{{end}}
</select>
</form>
</td></tr></table></div>
<div style="max-width:480px; margin:40px auto; background:#fff; border:1px solid #dee2e6; border-radius:6px; padding:24px; box-shadow:0 2px 8px rgba(0,0,0,0.08)">
<h2 style="text-align:center; color:#377CB0"><i class="bi bi-shield-lock"></i> Log in</h2>

{{if .Error}}<div class="alert alert-danger py-2"><i class="bi bi-exclamation-triangle"></i> {{.Error}}{{if .ErrorDetail}}<div style="font-size:11px; margin-top:4px; opacity:0.8">{{.ErrorDetail}}</div>{{end}}</div>{{end}}
<form method="POST" action="/login">
<div class="mb-2"><label class="form-label form-label-sm">Server</label><select name="server" class="form-select form-select-sm">{{range $i, $s := .Servers}}<option value="{{$i}}">{{$s.Desc}} — {{if $s.Host}}{{$s.Host}}{{else}}socket{{end}}:{{$s.Port}}</option>{{end}}</select></div>
<div class="mb-2"><label class="form-label form-label-sm">Username</label><input type="text" name="username" class="form-control form-control-sm" required /></div>
<div class="mb-3"><label class="form-label form-label-sm">Password</label><input type="password" name="password" class="form-control form-control-sm" required /></div>
<button type="submit" class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right"></i> Go</button>
</form>
<p class="text-muted" style="font-size:11px; margin-top:12px">PostgreSQL credentials are verified directly against the server.</p>

</div>
</body>
</html>
